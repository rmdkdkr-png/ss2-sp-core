name: build cores
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current source for all supported Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$NDK_DIR/ndk-build"
          cp src/*.c src/*.h build/
          "$NDK_DIR/ndk-build" -C build/jni -j2 APP_ABI="arm64-v8a armeabi-v7a x86_64" APP_PLATFORM=android-21
          mkdir -p out
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/libs/$ABI/libretro.so" "out/libretro_svc_lb_allchars_$ABI.so"
          done
          git rev-parse HEAD > out/source-commit.txt
          sha256sum out/*.so > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cores-android-lb-allchars
          path: out/
          if-no-files-found: error
